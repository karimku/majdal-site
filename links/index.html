<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dfeee3">
  <meta name="description" content="Discover Majdal — made for you. Find our Instagram, TikTok and email.">
  <title>Majdal | Made for You</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 35px 18px 50px; background: #dfeee3; color: #5a4a1a; font-family: Arial, sans-serif; }
    main { max-width: 460px; margin: 0 auto; text-align: center; }
    .brand { margin: 8px 0 6px; font-family: "Times New Roman", serif; font-size: clamp(38px, 11vw, 48px); font-weight: 400; letter-spacing: .06em; color: #b58a2a; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
    .tagline { margin: 0 0 25px; font-family: "Times New Roman", serif; font-size: 12px; letter-spacing: .35em; color: #9a7622; }
    .panel { padding: 18px 18px 25px; background: rgba(255,255,255,.62); border: 1px solid rgba(181,138,42,.30); border-radius: 18px; box-shadow: 0 18px 40px rgba(0,0,0,.08); }
    .hero { display: block; width: 100%; height: auto; border-radius: 11px; }
    .intro { margin: 22px 0; font-family: "Times New Roman", serif; font-size: 17px; line-height: 1.5; color: #9a7622; }
    .links { display: grid; gap: 12px; }
    .links a { display: block; padding: 15px 12px; border-radius: 10px; background: #b58a2a; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-decoration: none; }
    .links a:hover, .links a:focus-visible { background: #9a7622; outline-offset: 3px; }
    footer { margin-top: 26px; font-family: "Times New Roman", serif; font-size: 12px; letter-spacing: .12em; color: #9a7622; }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">MAJDAL</h1>
    <p class="tagline">MADE FOR YOU</p>
    <section class="panel" aria-label="Majdal social links">
      <img class="hero" src="majdal-photo.jpg" alt="Majdal clothing preview with business cards" width="1080" height="1440">
      <p class="intro">A little place to find everything Majdal.<br>Stay connected with us.</p>
      <nav class="links" aria-label="Find Majdal online">
        <a href="https://www.instagram.com/majdal_clothing/" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
        <a href="https://www.tiktok.com/@majdalclothing" target="_blank" rel="noopener noreferrer">TIKTOK</a>
        <a href="mailto:majdalofficial@gmail.com">EMAIL US</a>
      </nav>
    </section>
    <footer>MAJDAL · MADE FOR YOU</footer>
  </main>
</body>
</html>
